spec_id: 'workplan-work-package'
spec_version: '1.0'
spec_type: 'artifact_content_contract'
meta_spec_id: 'workplan-work-package'
meta_spec_version: '1.0'
meta_spec_type: 'artifact_content_contract'
document_kind: 'workplan-work-package'
artifact_kind: 'workPackage'
path_profile: '_workplan/*-work-packages/[0-9][0-9]-*.md'
applies_to:
  - '_workplan/*-work-packages/[0-9][0-9]-*.md'
language: 'zh-CN'
purpose: >-
  定义 workplan work package 文档的最小形状，用于检查单个工作包的
  目标、范围、质量标准、子计划和完成证据。

interpretation:
  not_a_backlog: true
  not_an_implementation_scope: true
  source_of_truth:
    - 'approved_work_breakdown'
    - 'current_user_request'
    - 'explicit_source_documents'
  ai_reading_rule: >-
    AI must read a work package as a scoped execution record. It must not add
    work outside its declared functional scope.

required_sections:
  - 'Metadata'
  - 'Objective'
  - 'Functional Scope'
  - 'Non-Functional Requirements'
  - 'Quality Standards'
  - 'Subplan'
  - 'Audit-Evaluate-Optimize Loop'
  - 'Definition Of Done'
  - 'Completion Evidence'

required_shape_semantics:
  closed_set: true
  exact_once: true
  duplicate_sections_invalid: true

artifact_profiles:
  work_package:
    artifact_kind: 'workPackage'
    path_profile: '_workplan/*-work-packages/[0-9][0-9]-*.md'
    required_slots_semantics: 'closed exact-once set; duplicates invalid'
    required_sections:
      - 'Metadata'
      - 'Objective'
      - 'Functional Scope'
      - 'Non-Functional Requirements'
      - 'Quality Standards'
      - 'Subplan'
      - 'Audit-Evaluate-Optimize Loop'
      - 'Definition Of Done'
      - 'Completion Evidence'

scope_fences:
  hard_boundary:
    - 'This package contract does not authorize out-of-scope work.'
    - 'This package contract does not prove command or review authenticity.'
    - 'This package contract must remain outside DAAT core admission.'
  expansion_policy:
    - 'Optional package sections require explicit context triggers.'
    - 'Missing SHOULD or MAY sections create findings only.'
    - 'Examples must not generate executable work items.'

linter_behavior:
  must_checks:
    - 'work package required sections exist exactly once'
    - 'duplicate work package required sections are invalid'
    - 'execution items reference package scope and quality gates'
    - 'completion evidence references package DoD criteria and gates'
  should_checks:
    - 'Subplan should keep implementation steps ordered'
    - 'Quality Standards should reference reviewable gates'
  may_checks:
    - 'work packages may include risks, open questions, or notes'
  severity_mapping:
    missing_must: 'error'
    missing_should: 'warning'
    missing_may: 'advisory'
    must_not_violation: 'error'
    scope_overreach: 'error'
    expansion_without_trigger: 'warning'
    ambiguous_example: 'warning'

optional_sections:
  - id: 'risks'
    title: 'Risks'
    level: 'should'
    include_when:
      - 'the package touches external tools, migrations, or evidence drift'
  - id: 'open-questions'
    title: 'Open Questions'
    level: 'may'
    include_when:
      - 'there are unresolved design choices'
  - id: 'notes'
    title: 'Notes'
    level: 'may'
    include_when:
      - 'the package needs extra context but not a new requirement'

static_checks:
  must:
    - 'package file name uses lower-kebab-case and a stable package prefix'
    - 'required sections exist exactly once'
    - 'Metadata declares package id, status, source, and dependency fields'
    - 'Functional Scope separates in-scope work from out-of-scope work'
    - 'Definition Of Done lists verifiable completion criteria'
    - 'Completion Evidence records files, commands, or review evidence'
  should:
    - 'Subplan should keep implementation steps ordered'
    - 'Quality Standards should reference executable or reviewable gates'
  must_not:
    - 'work package must not add scope outside Functional Scope'
    - 'work package must not claim completion without evidence'
    - 'work package must not redefine roadmap or work breakdown goals'

execution_readiness:
  package_id_matches_document: true
  executable_items_must_use_functional_scope_in: true
  executable_items_must_not_use_functional_scope_out: true
  executable_items_must_reference_package_quality_gate: true
  command_execution_authenticity_proven_by_contract: false
  review_authenticity_proven_by_contract: false

completion_evidence_contract:
  evidence_must_reference_package_id: true
  evidence_must_reference_dod_criterion: true
  evidence_must_reference_quality_gate: true
  evidence_supports_package_dod_criterion: true
  file_command_review_evidence_is_reviewable_support_only: true

severity_mapping:
  missing_must: 'error'
  missing_should: 'warning'
  missing_may: 'advisory'
  must_not_violation: 'error'
  scope_overreach: 'error'
  expansion_without_trigger: 'warning'
  ambiguous_example: 'warning'

generation_guard:
  optional_missing_creates_finding_only: true
  examples_create_finding_only: true
  executable_items_from_optional_missing: false

examples:
  informative_only: true
  files:
    - '_workplan/2026-05-07-agent-skill-linter-wbs/00-governance-evidence-baseline.md'
  legacy_term_note: >-
    Existing examples may use WBS ids. New work package documents should avoid
    PMI-specific names unless the project explicitly adopts PMI semantics.
