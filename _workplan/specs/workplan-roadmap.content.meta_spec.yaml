spec_id: 'workplan-roadmap'
spec_version: '1.0'
spec_type: 'artifact_content_contract'
meta_spec_id: 'workplan-roadmap'
meta_spec_version: '1.0'
meta_spec_type: 'artifact_content_contract'
document_kind: 'workplan-roadmap'
artifact_kind: 'roadmap'
path_profile: '_workplan/*-roadmap.md'
applies_to:
  - '_workplan/*-roadmap.md'
language: 'zh-CN'
purpose: >-
  定义 workplan roadmap 文档的最小形状，用于静态检查路线图是否有
  清晰目标、来源、阶段和质量门禁。

interpretation:
  not_a_backlog: true
  not_an_implementation_scope: true
  source_of_truth:
    - 'current_user_request'
    - 'explicit_source_documents'
    - 'approved_workplan_artifact'
  ai_reading_rule: >-
    AI must read roadmap documents as planning artifacts, not as authorization
    to execute every listed phase.
  approved_hierarchy_rule: >-
    An approved roadmap may authorize downstream work breakdown planning, but
    it does not directly authorize package execution.

required_frontmatter: []

required_sections:
  - 'Goal'
  - 'Source Documents'
  - 'Current Implementation'
  - 'Target Capability'
  - 'Roadmap Phases'
  - 'Quality Gates'

required_shape_semantics:
  closed_set: true
  exact_once: true
  duplicate_sections_invalid: true

artifact_profiles:
  roadmap:
    artifact_kind: 'roadmap'
    path_profile: '_workplan/*-roadmap.md'
    required_slots_semantics: 'closed exact-once set; duplicates invalid'
    required_sections:
      - 'Goal'
      - 'Source Documents'
      - 'Current Implementation'
      - 'Target Capability'
      - 'Roadmap Phases'
      - 'Quality Gates'

scope_fences:
  hard_boundary:
    - 'This roadmap contract does not authorize package execution.'
    - 'This roadmap contract does not prove filesystem or review behavior.'
    - 'This roadmap contract must remain outside DAAT core admission.'
  expansion_policy:
    - 'Optional roadmap sections require explicit context triggers.'
    - 'Missing SHOULD or MAY sections create findings only.'
    - 'Examples must not generate executable work items.'

linter_behavior:
  must_checks:
    - 'roadmap required sections exist exactly once'
    - 'duplicate roadmap required sections are invalid'
    - 'roadmap path follows the declared _workplan profile'
  should_checks:
    - 'roadmap should include risks when external evidence can drift'
    - 'roadmap should state finite completion targets when applicable'
  may_checks:
    - 'roadmap may include open questions or decision logs'
  severity_mapping:
    missing_must: 'error'
    missing_should: 'warning'
    missing_may: 'advisory'
    must_not_violation: 'error'
    scope_overreach: 'error'
    expansion_without_trigger: 'warning'
    ambiguous_example: 'warning'

optional_sections:
  - id: 'risks'
    title: 'Risks'
    level: 'should'
    include_when:
      - 'external tools or vendor behavior can change'
      - 'work spans multiple work packages'
  - id: 'residual-risks'
    title: 'Residual Risks'
    level: 'should'
    include_when:
      - 'fallback behavior or incomplete evidence remains'
  - id: 'open-questions'
    title: 'Open Questions'
    level: 'may'
    include_when:
      - 'scope has unresolved decisions'

static_checks:
  must:
    - 'roadmap file name uses lower-kebab-case and date prefix when dated'
    - 'required sections exist exactly once'
    - 'Source Documents section lists explicit evidence or source paths'
    - 'Roadmap Phases section contains ordered phases'
    - 'Quality Gates section lists executable or reviewable gates'
  should:
    - 'risks section exists when roadmap depends on external evidence'
    - 'completion target is stated when the plan is finite'
  must_not:
    - 'roadmap must not claim implementation completion without evidence'
    - 'roadmap must not replace the work breakdown or work package layer'

severity_mapping:
  missing_must: 'error'
  missing_should: 'warning'
  missing_may: 'advisory'
  must_not_violation: 'error'
  scope_overreach: 'error'
  expansion_without_trigger: 'warning'
  ambiguous_example: 'warning'

generation_guard:
  optional_missing_creates_finding_only: true
  examples_create_finding_only: true
  executable_items_from_optional_missing: false

examples:
  informative_only: true
  files:
    - '_workplan/2026-05-07-agent-skill-linter-roadmap.md'
