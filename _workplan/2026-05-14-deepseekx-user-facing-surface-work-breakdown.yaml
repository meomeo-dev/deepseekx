goal: >-
  将 DeepSeekX 下游产品的用户可见入口调整为 DeepSeekX，
  同时保留 Codex 内核命名，并与原版 OpenAI Codex 运行环境隔离。
task_type: 'implementation_plan'
status: 'completed'
source_of_truth:
  current_user_request: true
  roadmap: '_workplan/2026-05-14-deepseekx-user-facing-surface-roadmap.md'
  analysis:
    - 'docs/deepseek-api/integration/deepseekx-user-facing-surface.md'
    - 'docs/deepseek-api/integration/README.md'
    - '_workplan/specs/workplan-artifact-boundary.content.spec.yaml'
    - '_workplan/specs/workplan-roadmap.content.meta_spec.yaml'
    - '_workplan/specs/workplan-work-breakdown.content.meta_spec.yaml'
    - '_workplan/specs/workplan-work-package.content.meta_spec.yaml'
principles:
  - '外壳优先：用户看到和输入的入口优先 DeepSeekX 化。'
  - '内核保留：Rust crate、核心类型和 v2 wire schema 默认不改名。'
  - '隔离优先：不安装 codex alias，不读取 CODEX_HOME 或 ~/.codex。'
  - '小包推进：每次只改一个主要用户感知面。'
  - '禁止全仓库字符串替换。'
quality_gates:
  - '新增和修改文件必须通过 88 字符行宽检查。'
  - '文档和代码变更必须通过 git diff --check。'
  - 'Rust 修改后在 codex-rs 运行 just fmt。'
  - 'TUI 文案改动必须运行 codex-tui 测试并审查 snapshot。'
  - '配置 schema 改动必须运行 just write-config-schema。'
  - 'app-server 协议改动必须运行 app-server schema 生成和测试。'
  - '每个 package 完成时更新 Completion Evidence。'
assumptions:
  - 'DeepSeekX 不准备在首轮重命名内部 Rust crate。'
  - 'app-server v2 wire schema 保持兼容，SDK 包装层负责隐藏旧名。'
  - '原版 Codex 配置不属于 DeepSeekX 的自动兼容路径。'
scope_notes:
  in:
    - 'CLI 主入口、帮助文本和 exec 人类可读输出。'
    - 'TUI 标题、placeholder、状态卡、approval 文案和 snapshot。'
    - 'DeepSeekX 默认 provider、模型和 API key 提示。'
    - 'DEEPSEEKX_HOME 和 ~/.deepseekx 配置隔离。'
    - 'npm、平台包、nightly artifact 和安装脚本命名。'
    - 'SDK 包装层、examples 和 app-server 启动感知。'
    - '新旧入口兼容验收。'
  out:
    - '全仓库 Codex 到 DeepSeekX 字符串替换。'
    - 'Rust crate、核心类型和测试 fixture 的系统性重命名。'
    - 'app-server v2 payload 字段和 JSON-RPC method 改名。'
    - '读取 CODEX_HOME 或 ~/.codex 作为 DeepSeekX 配置。'
    - '静默复制、移动或删除用户 secret。'
    - '发布 codex 命令、软链接、shim 或 npm bin alias。'
planned_work_packages:
  - id: '00-cli-launcher-help'
    name: 'CLI launcher 和帮助文案'
    status: 'completed'
    document: "_workplan/2026-05-14-deepseekx-user-facing-surface-work-packages/\
      00-cli-launcher-help.md"
    managed_requirements:
      - '提供 deepseekx 主命令，不发布 codex 兼容入口。'
    functional_scope:
      in:
        - 'CLI binary、clap bin_name、usage 和 exec 输出。'
      out:
        - 'TUI snapshot 和发布包命名。'
  - id: '01-tui-branding-snapshots'
    name: 'TUI 品牌文案和 snapshot'
    status: 'completed'
    document: "_workplan/2026-05-14-deepseekx-user-facing-surface-work-packages/\
      01-tui-branding-snapshots.md"
    managed_requirements:
      - 'TUI 首页和常用交互文案展示 DeepSeekX。'
    functional_scope:
      in:
        - 'TUI title、status card、placeholder、approval 文案。'
      out:
        - 'CLI launcher 和配置目录迁移。'
  - id: '02-default-provider-auth'
    name: '默认 provider 和认证提示'
    status: 'completed'
    document: "_workplan/2026-05-14-deepseekx-user-facing-surface-work-packages/\
      02-default-provider-auth.md"
    managed_requirements:
      - 'DeepSeekX 默认模型路径面向 DeepSeek API。'
    functional_scope:
      in:
        - '默认 provider、默认模型和 API key 提示。'
      out:
        - 'OpenAI provider 兼容能力删除。'
  - id: '03-config-home-isolation'
    name: '配置 home 隔离层'
    status: 'completed'
    document: "_workplan/2026-05-14-deepseekx-user-facing-surface-work-packages/\
      03-config-home-isolation.md"
    managed_requirements:
      - '支持 DeepSeekX 配置目录，不读取 legacy Codex 路径。'
    functional_scope:
      in:
        - 'DEEPSEEKX_HOME 和 ~/.deepseekx。'
      out:
        - '读取 CODEX_HOME 或 ~/.codex。'
        - '静默迁移 secret 或删除旧配置。'
  - id: '04-packaging-artifacts'
    name: '打包产物和发布命名'
    status: 'completed'
    document: "_workplan/2026-05-14-deepseekx-user-facing-surface-work-packages/\
      04-packaging-artifacts.md"
    managed_requirements:
      - '安装包、npm 包和 nightly artifact 使用 DeepSeekX 命名。'
    functional_scope:
      in:
        - 'npm package、platform package、workflow artifact、installer。'
      out:
        - '正式签名发布和 release tag 策略。'
        - 'codex alias。'
  - id: '05-sdk-app-server-surface'
    name: 'SDK 与 app-server 用户感知'
    status: 'completed'
    document: "_workplan/2026-05-14-deepseekx-user-facing-surface-work-packages/\
      05-sdk-app-server-surface.md"
    managed_requirements:
      - 'SDK 包装层使用 DeepSeekX，v2 wire schema 保持兼容。'
    functional_scope:
      in:
        - 'SDK package surface、examples、binary lookup、client_info 默认值。'
      out:
        - 'v2 JSON-RPC method 和 payload 字段改名。'
        - 'SDK fallback 到 codex binary。'
  - id: '06-compatibility-verification'
    name: '兼容验收和回归验证'
    status: 'completed'
    document: "_workplan/2026-05-14-deepseekx-user-facing-surface-work-packages/\
      06-compatibility-verification.md"
    managed_requirements:
      - '验证 DeepSeekX 与原版 OpenAI Codex 环境隔离。'
    functional_scope:
      in:
        - 'CLI、TUI、配置、provider、SDK 和打包隔离验收矩阵。'
      out:
        - '真实发布到 npm、PyPI 或 GitHub release。'

completion_evidence:
  summary: >-
    Current branch implements DeepSeekX user-facing isolation across CLI,
    TUI, provider defaults, config home, packaging, SDK, and app-server
    surface while retaining internal Codex protocol and crate names.
  commands:
    - 'INSTA_UPDATE=always CARGO_BUILD_JOBS=4 cargo test -p codex-tui'
    - 'cargo test -p codex-login'
    - 'cargo test -p codex-model-provider'
    - >-
      cargo test -p codex-models-manager
      refresh_available_models_skips_network_without_chatgpt_auth
    - 'cargo test -p codex-app-server external_agent_config'
    - 'just write-config-schema'
    - 'just write-app-server-schema'
    - 'python3 -m py_compile sdk/python/scripts/update_sdk_artifacts.py'
    - "git diff --check -- . ':(exclude)*.snap'"
    - >-
      cargo test -p codex-cli rejects_legacy_codex_argv0_names
    - >-
      cargo test -p codex-cli --bin deepseekx
      root_version_uses_deepseekx_product_name
    - >-
      cargo test -p codex-cli --bin deepseekx
      cloud_help_is_disabled_without_codex_cloud_subcommands
    - >-
      cargo test -p codex-mcp
      mcp_init_error_display_prompts_for_login_when_auth_required
  scans:
    - >-
      Runtime entrypoint scan found no user-facing `codex` binary fallback,
      npm `bin/codex.js`, or `cargo run ... --bin codex` path outside
      historical integration-document checklist text.
    - >-
      `CODEX_*` scan found TypeScript SDK drop-list/tests and internal
      compatibility constants whose values now use DeepSeekX environment
      variables; DeepSeekX SDK does not inherit `CODEX_HOME`.
    - >-
      CLI argv0 guard rejects direct `codex` or `codex.exe` invocation so a
      packaging or PATH mistake cannot make DeepSeekX masquerade as Codex.
    - >-
      Local source-built `deepseekx --version` runs and reports the DeepSeekX
      product name.
  residual_boundaries:
    - 'Rust crate/package names and app-server v2 wire fields retain Codex names.'
    - '`dotCodexFolder` remains the v2 field name; descriptions now say `.deepseekx/`.'
    - 'Snapshot filenames retain upstream `codex_tui__...` test target names.'
    - >-
      `sdk/python/uv.lock` retains `openai-codex-cli-bin` until
      `deepseekx-cli-bin` is published or available as a resolvable source.
    - >-
      `just fmt` fails after Rust formatting when uv cannot resolve
      `deepseekx-cli-bin==0.131.0a4`; this is a release packaging blocker.
